[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-db-0816"
version = "0.2.0"
description = "Minimal SQL engine skeleton with sqllogictest runner (sql-db-0816)"
requires-python = ">=3.9"
# 纯标准库实现,无第三方运行时依赖

[project.scripts]
sql-db-sqllogictest = "sql_db_0816.sqllogictest:main"

[tool.setuptools.packages.find]
where = ["src"]
